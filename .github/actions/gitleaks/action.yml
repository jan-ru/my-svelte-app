name: Install gitleaks
description: >-
  Puts the pinned gitleaks release on PATH, checked against its SHA-256 (jan-ru/system-health ADR-0011). Used by the
  pull request step in ci.yml and the release count in release-assets.yml. To move to a new version, change both values
  together: the hash is the linux_x64 line of the release's gitleaks_<version>_checksums.txt.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITLEAKS_VERSION: "8.30.1"
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -fsSL --max-time 120 -o "$RUNNER_TEMP/$archive" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
        echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/gitleaks-bin"
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
        echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
