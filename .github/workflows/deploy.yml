name: App production deploy (deploy)

# Stage: deployment. See docs/workflows.md and RELEASING.md.
# Production deploys only from a release (jan-ru/.github ADR-0001 part 7): release-assets.yml calls this workflow once
# the shared release workflow has created the release. A manual run names an existing release tag and deploys it again,
# which is how a rollback works. Vercel's own Git integration no longer deploys `main` (`git.deploymentEnabled` in
# vercel.json); pull requests still get previews from it.
#
# The tag's source is uploaded and Vercel builds it remotely, with the project's own environment variables, so no
# secret of the app ever reaches the runner. Only the deploy token does, in this job, which runs no npm code of this
# repository.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag (YYYY.0M.0D) to deploy to production
        required: true
        type: string

permissions:
  contents: read

# One production deploy at a time; a newer one waits instead of cancelling a deploy that is already running.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Refuse anything but a published release
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_ORG: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_PROJECT: ${{ secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          set -euo pipefail
          refuse() { echo "::error title=Deploy refused::$*"; exit 1; }
          [[ "$TAG" =~ ^20[0-9]{2}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])$ ]] || refuse "$TAG is not a release tag (YYYY.0M.0D)"
          release=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease) || refuse "there is no release $TAG"
          jq -e '.isDraft == false and .isPrerelease == false' <<<"$release" >/dev/null \
            || refuse "release $TAG is a draft or a pre-release, which is never deployed (ADR-0001 part 5)"
          [ "$HAS_TOKEN" = true ] && [ "$HAS_ORG" = true ] && [ "$HAS_PROJECT" = true ] \
            || refuse "the secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID must all be set (docs/workflows.md)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: deploy
        name: Deploy the tag to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # The CLI is pinned: an unpinned npx would resolve the newest release at run time. Bump it by hand.
        run: |
          set -euo pipefail
          url=$(npx --yes vercel@65.12.1 deploy --prod --yes --token "$VERCEL_TOKEN" --meta "release=$TAG")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $TAG to production: $url" >> "$GITHUB_STEP_SUMMARY"
