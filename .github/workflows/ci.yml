name: CI (merge gate)

# Stage: merge gate. The `test` job is the one required check on `main`; `lighthouse` is development feedback only.
# All workflows by stage: docs/workflows.md. The ruleset binds to the job name `test`, so do not rename it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:ts-only
      - run: npm run test:coverage
      - run: npm run build
      # browser smoke tests on the production build: page errors, CSP blocks, login, upload and axe (see e2e/)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # runtime dependencies only; dev tooling advisories don't ship to users
      - run: npm audit --omit=dev --audit-level=high

  # Not part of the required `test` check: Lighthouse scores wobble on shared runners, so it reports without blocking merges.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # serves the production build with `vite preview` and audits the public pages (see lighthouserc.json)
      - run: npx --yes @lhci/cli@0.15.1 autorun
