name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:ts-only
      - run: npm run test:coverage
      - run: npm run build
      # browser smoke tests on the production build: page errors, CSP blocks, login, upload and axe (see e2e/)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # runtime dependencies only; dev tooling advisories don't ship to users
      - run: npm audit --omit=dev --audit-level=high

  # Not part of the required `test` check: Lighthouse scores wobble on shared runners, so it reports without blocking merges.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # serves the production build with `vite preview` and audits the public pages (see lighthouserc.json)
      - run: npx --yes @lhci/cli@0.15.1 autorun
