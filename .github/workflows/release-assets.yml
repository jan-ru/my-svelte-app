name: Release assets (deploy)

# Stage: deployment. See docs/workflows.md and RELEASING.md. The release standard of every jan-ru repository with
# production software is jan-ru/.github ADR-0001: a release tag is the only way to production.
#
# Pushing a release tag builds the overview PDF and metrics.json from a checkout of the tag, after a run of the checks
# and tests there. A red check or test does not stop the PDF: it shows on the quality page and in metrics.json. Then
# `release` hands both to the shared release workflow, which guards the tag (on main, the merge of a PR that passed
# `test`), creates the full release from the tag's CHANGELOG.md section only when it does not exist yet, and attaches
# the assets (`--clobber`, so a re-run replaces them). Only after the release do `deploy` (the app, to Vercel
# production) and `api-docs` (the API reference, to Cloudflare Pages) run.
#
# A pull request that touches what the PDF is built from builds a preview (no tests, quality "not measured") as a
# workflow artifact, so a release PR shows its PDF before the tag. A manual run names an existing tag: dry_run true
# (the default) builds and publishes nothing, false releases what is missing, attaches the assets again and deploys
# that tag, which is also how to roll back. A tag cut before this workflow existed cannot be rebuilt: its checkout
# has no build-overview.ts.
#
# `scorecard` runs OpenSSF Scorecard against the repository (no checkout) and `build` adds its result to metrics.json.
#
# Building and writing are separate jobs: `build` holds a read-only token; `release` is the shared workflow, pinned by
# SHA, and runs no code of this repository.
on:
  push:
    tags:
      - "20[0-9][0-9].[0-9][0-9].[0-9][0-9]"
  pull_request:
    paths:
      - CHANGELOG.md
      - docs/overview.md
      - docs/adr/**
      - docs/quality/README.md
      - src/lib/overview/**
      - scripts/build-overview.ts
      - .github/workflows/release-assets.yml
      - package.json
      - package-lock.json
      - scripts/release-notes.ts
      - src/lib/at.ts
      - src/lib/metrics.ts
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag (YYYY.0M.0D)
        required: true
        type: string
      dry_run:
        description: Build only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$EVENT" in
            push) tag="$REF_NAME"; publish=true ;;
            workflow_dispatch) tag="$INPUT_TAG"; if [ "$INPUT_DRY_RUN" = false ]; then publish=true; else publish=false; fi ;;
            *) tag=""; publish=false ;;
          esac
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^20[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "::error::$tag is not a release tag (YYYY.0M.0D)"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # OpenSSF Scorecard of the repository as it is during this run (jan-ru/system-health ADR-0005, ADR-0009): the
  # command-line tool, a pinned release checked against its hash, in default mode, with this job's read-only token. No
  # checkout: it reads the repository through the API, so no code of this repository runs with the wider read scopes
  # it needs. `build` adds the result to metrics.json as `security.scorecard`. Measured, not a gate: whatever fails
  # here is a warning and leaves `scorecard` out, and the job itself never fails, so it cannot skip the release or the
  # deploy after it. Only a tag is measured; a PR preview has no metrics.json.
  scorecard:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      statuses: read
      security-events: read
    outputs:
      built: ${{ steps.scorecard.outputs.built }}
    env:
      SCORECARD_VERSION: "5.7.0"
      SCORECARD_SHA256: 3b08ec0a8681806c3e744ec9210742a502c7d66f06f25523b70f7128738235d3
    steps:
      # ADR-0005's shape: `version` and `score` as Scorecard reports them, and each check that was decided, every -1
      # left out. An overall -1 (nothing decided) writes nothing.
      - name: Run Scorecard
        id: scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
          REPO: github.com/${{ github.repository }}
        run: |
          set -uo pipefail
          # An explicit && chain: bash ignores `set -e` in a function called from `if`, and a hash that does not match
          # must stop before the binary runs.
          archive="scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz"
          measure() {
            curl -fsSL --max-time 120 -o "$RUNNER_TEMP/$archive" "https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/$archive" &&
              echo "$SCORECARD_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c - &&
              mkdir -p "$RUNNER_TEMP/scorecard-bin" "$RUNNER_TEMP/scorecard" &&
              tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/scorecard-bin" scorecard &&
              timeout 300 "$RUNNER_TEMP/scorecard-bin/scorecard" --repo="$REPO" --format=json > "$RUNNER_TEMP/scorecard.raw.json" &&
              jq -c '
                if (.score | type) == "number" and .score >= 0 and .score <= 10
                   and (.scorecard.version | type) == "string" and (.scorecard.version | length) > 0
                then {version: .scorecard.version, score: .score}
                     + ([.checks[]? | select((.score | type) == "number" and .score >= 0 and .score <= 10 and .score == (.score | floor))
                         | {key: .name, value: .score}]
                        | if length > 0 then {checks: from_entries} else {} end)
                else empty end' "$RUNNER_TEMP/scorecard.raw.json" > "$RUNNER_TEMP/scorecard/scorecard.json" &&
              [ -s "$RUNNER_TEMP/scorecard/scorecard.json" ]
          }
          if measure; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Scorecard result for this release: metrics.json leaves security.scorecard out"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep the Scorecard result
        if: steps.scorecard.outputs.built == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-scorecard
          path: ${{ runner.temp }}/scorecard/scorecard.json
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  build:
    needs: [plan, scorecard]
    # Whatever `scorecard` did, skipped on a PR included.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag && format('refs/tags/{0}', needs.plan.outputs.tag) || '' }}
          # every tag and commit: Landed is a git range between tags
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Measured at the tag only. Each step may fail: its outcome feeds metrics.json and the quality page.
      - id: check
        if: env.TAG != ''
        continue-on-error: true
        run: npm run check
      - id: lint
        if: env.TAG != ''
        continue-on-error: true
        run: npm run lint
      - id: unit
        if: env.TAG != ''
        continue-on-error: true
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile.json=reports/test/vitest.json
      - id: e2e
        if: env.TAG != ''
        continue-on-error: true
        run: npm run build && npm run test:e2e -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/test/playwright.json
      # Lighthouse at the tag, over the build the e2e step made, with the same pinned lhci and lighthouserc.json as
      # ci.yml. `collect`, not `autorun`: the score floors are feedback on pull requests, not a gate on the release. A
      # failure leaves performance.lighthouse out of metrics.json (not measured). .lighthouseci is hidden, so the
      # results are copied to where build-metrics.ts reads them.
      - id: lighthouse
        if: env.TAG != ''
        continue-on-error: true
        run: |
          npx --yes @lhci/cli@0.15.1 collect
          mkdir -p reports/lighthouse
          cp .lighthouseci/lhr-*.json reports/lighthouse/
      - name: metrics.json
        if: env.TAG != ''
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_RESULT: ${{ (steps.check.outcome == 'success' && steps.lint.outcome == 'success' && steps.unit.outcome == 'success' && steps.e2e.outcome == 'success') && 'success' || 'failure' }}
        run: |
          mkdir -p reports/test assets
          cp coverage/coverage-summary.json reports/test/ || true
          npm audit --package-lock-only --json > reports/npm-audit.json || true
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_REF="refs/tags/$TAG" node scripts/build-metrics.ts reports > assets/metrics.json
      # Beside the assets, not among them: the result goes into metrics.json, not onto the release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.TAG != '' && needs.scorecard.outputs.built == 'true'
        with:
          name: release-scorecard
          path: ${{ runner.temp }}/scorecard
      - name: Add the Scorecard result to metrics.json
        if: env.TAG != '' && needs.scorecard.outputs.built == 'true'
        run: |
          jq --slurpfile sc "$RUNNER_TEMP/scorecard/scorecard.json" '.security = ((.security // {}) + {scorecard: $sc[0]})' \
            assets/metrics.json > "$RUNNER_TEMP/metrics.json"
          mv "$RUNNER_TEMP/metrics.json" assets/metrics.json
      - name: The overview PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          if [ -n "$TAG" ]; then
            node scripts/build-overview.ts --release "$TAG" --metrics assets/metrics.json --out "assets/my-svelte-app-overview-$TAG.pdf"
          else
            node scripts/build-overview.ts --out assets/my-svelte-app-overview-preview.pdf
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets/
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  # The guard, the notes from CHANGELOG.md, the metrics.json check and the full release are the shared workflow's
  # (ADR-0001). It downloads this run's `release-assets` artifact and attaches all of it.
  release:
    name: release (jan-ru/.github ADR-0001)
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    uses: jan-ru/.github/.github/workflows/release.yml@ecd99374eed7aea24977d4bfa6b148d9ecff86f2 # 2026.11.22
    with:
      tag: ${{ needs.plan.outputs.tag }}
      changelog: CHANGELOG.md
      latest: true
      assets-artifact: release-assets
    permissions:
      contents: write
      pull-requests: read
      checks: read
      statuses: read

  # Production deploys only from a release (ADR-0001 part 7); vercel.json turns off Vercel's own deploys of `main`.
  # Vercel builds the uploaded tag with its production environment variables, so no app secret reaches this runner.
  # A rollback is Vercel's Instant Rollback to an earlier release's deployment, or a manual run for that tag.
  deploy:
    name: deploy (Vercel production)
    needs: [plan, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Deploy the tag to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@66.6.0 deploy --prod --yes --token="$VERCEL_TOKEN" \
            --meta githubCommitSha="$(git rev-parse HEAD)" --meta githubCommitRef="$TAG"

  # The API reference, from the release as well.
  api-docs:
    needs: [plan, release]
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.plan.outputs.tag }}
    secrets: inherit
