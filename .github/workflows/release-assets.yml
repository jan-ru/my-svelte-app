name: Release assets (deploy)

# Stage: deployment. See docs/workflows.md and RELEASING.md.
#
# Pushing a release tag builds the overview PDF and metrics.json from a checkout of the tag, after a run of the checks
# and tests there. A red check or test does not stop the PDF: it shows on the quality page. Then the shared release
# workflow (jan-ru/.github ADR-0001) guards the tag, creates the full release from the tag's CHANGELOG.md section and
# attaches both files. Only after the release exists does production follow: the app (deploy.yml) and the API
# reference (docs.yml), both from the tag.
#
# A pull request that touches what the PDF is built from builds a preview (no tests, quality "not measured") as a
# workflow artifact, so a release PR shows its PDF before the tag. A manual run names an existing tag: dry_run true
# (the default) builds and publishes nothing; false runs the release again (an existing release keeps its notes, the
# assets are uploaded again) and deploys it. To deploy an earlier release again without rebuilding, run deploy.yml.
#
# Building and writing are separate jobs: `build` holds a read-only token; the shared `release` job holds the write
# token and runs no code of this repository.
on:
  push:
    tags:
      - "20[0-9][0-9].[0-9][0-9].[0-9][0-9]"
  pull_request:
    paths:
      - CHANGELOG.md
      - docs/overview.md
      - docs/adr/**
      - docs/quality/README.md
      - src/lib/overview/**
      - scripts/build-overview.ts
      - .github/workflows/release-assets.yml
      - package.json
      - package-lock.json
      - src/lib/at.ts
      - src/lib/metrics.ts
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag (YYYY.0M.0D)
        required: true
        type: string
      dry_run:
        description: Build only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$EVENT" in
            push) tag="$REF_NAME"; publish=true ;;
            workflow_dispatch) tag="$INPUT_TAG"; if [ "$INPUT_DRY_RUN" = false ]; then publish=true; else publish=false; fi ;;
            *) tag=""; publish=false ;;
          esac
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^20[0-9]{2}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])$ ]]; then
            echo "::error::$tag is not a release tag (YYYY.0M.0D)"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag && format('refs/tags/{0}', needs.plan.outputs.tag) || '' }}
          # every tag and commit: Landed is a git range between tags
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Measured at the tag only. Each step may fail: its outcome feeds metrics.json and the quality page.
      - id: check
        if: env.TAG != ''
        continue-on-error: true
        run: npm run check
      - id: lint
        if: env.TAG != ''
        continue-on-error: true
        run: npm run lint
      - id: unit
        if: env.TAG != ''
        continue-on-error: true
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile.json=reports/test/vitest.json
      - id: e2e
        if: env.TAG != ''
        continue-on-error: true
        run: npm run build && npm run test:e2e -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/test/playwright.json
      - name: metrics.json
        if: env.TAG != ''
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_RESULT: ${{ (steps.check.outcome == 'success' && steps.lint.outcome == 'success' && steps.unit.outcome == 'success' && steps.e2e.outcome == 'success') && 'success' || 'failure' }}
        run: |
          mkdir -p reports/test assets
          cp coverage/coverage-summary.json reports/test/ || true
          npm audit --package-lock-only --json > reports/npm-audit.json || true
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_REF="refs/tags/$TAG" node scripts/build-metrics.ts reports > assets/metrics.json
      - name: The overview PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          if [ -n "$TAG" ]; then
            node scripts/build-overview.ts --release "$TAG" --metrics assets/metrics.json --out "assets/my-svelte-app-overview-$TAG.pdf"
          else
            node scripts/build-overview.ts --out assets/my-svelte-app-overview-preview.pdf
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets/
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  # The shared workflow (jan-ru/.github ADR-0001): the guard, the full release from the changelog, and the assets. It
  # waits for `build` alone: a red check at the tag is recorded in metrics.json and does not stop the release (part 6).
  release:
    name: release (jan-ru/.github ADR-0001)
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    uses: jan-ru/.github/.github/workflows/release.yml@ecd99374eed7aea24977d4bfa6b148d9ecff86f2
    with:
      changelog: CHANGELOG.md
      latest: true
      assets-artifact: release-assets
      # Empty on a tag push, where the shared workflow takes the pushed tag; the named tag on a manual run.
      tag: ${{ github.event_name == 'workflow_dispatch' && needs.plan.outputs.tag || '' }}
    permissions:
      contents: write
      pull-requests: read
      checks: read
      statuses: read

  # Production follows the release, never a merge (ADR-0001 part 7).
  deploy:
    needs: [plan, release]
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit

  docs:
    needs: [plan, release]
    uses: ./.github/workflows/docs.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit
