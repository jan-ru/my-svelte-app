name: NYU data check (scheduled)

# Stage: scheduled, not tied to a change. See docs/workflows.md.
# Fetches the real NYU workbooks and confirms every catalog column still resolves.
# A failed run emails the repo owner, which is the signal to update src/lib/catalog.ts.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:data
