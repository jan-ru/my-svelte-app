name: API docs

# Builds the TypeDoc reference (`npm run docs`) and publishes it to GitHub Pages. Pull requests that touch the
# documented code only build it, so a doc warning shows up before merge; only main deploys. This is separate from the
# app's own deployment, which is Vercel (see vercel.json).
on:
  push:
    branches: [main]
    paths: [src/lib/**, typedoc.json, tsconfig.json, package.json, package-lock.json, .github/workflows/docs.yml]
  pull_request:
    paths: [src/lib/**, typedoc.json, tsconfig.json, package.json, package-lock.json, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs
      # Keep the reference out of search results; delete this step to let search engines index it.
      - run: find docs/api -name '*.html' -exec perl -pi -e 's|<head>|<head><meta name="robots" content="noindex">|' {} +
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
