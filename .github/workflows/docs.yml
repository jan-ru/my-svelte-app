name: API docs (deploy)

# Stage: deployment (the `build` job also gives development feedback on pull requests). See docs/workflows.md.
# Builds the TypeDoc reference (`npm run docs`) and publishes it to Cloudflare Pages, project my-svelte-app-docs
# (https://my-svelte-app-docs.pages.dev/), the way finance-tools publishes its docs. The reference is published at a
# release, not at every merge: what readers see is what was released. Pull requests that touch the documented code
# only build it, so a doc warning shows up before merge. This is separate from the app's own deployment, which is
# Vercel (see vercel.json). The workflow runs in the private repository only: .public-exclude keeps it out of the
# public snapshots.
on:
  push:
    # A CalVer release tag (RELEASING.md). No `paths:` here: GitHub does not evaluate path filters on a tag push, and a
    # release is exactly when the whole reference should be current.
    tags:
      - "20[0-9][0-9].[0-9][0-9].[0-9][0-9]*"
  pull_request:
    paths: [src/lib/**, typedoc.json, tsconfig.json, package.json, package-lock.json, .github/workflows/docs.yml]
  # Publishing by hand between releases: Actions -> Run workflow. "Use workflow from" picks what is published: `main`
  # for the current state, or a release tag to republish (or roll back to) that release.
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling a deploy that is already running.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs
      # Keep the reference out of search results; delete this step to let search engines index it.
      - run: find docs/api -name '*.html' -exec perl -pi -e 's|<head>|<head><meta name="robots" content="noindex">|' {} +
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-docs
          path: docs/api
          retention-days: 1

  # A separate job with no checkout, as in finance-tools: the Cloudflare token never shares a job with the build, and
  # wrangler-action installs wrangler into an empty directory rather than into this npm project.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-docs
          path: site
      # `--branch=main` must match the Pages project's production branch, or the deploy lands as a preview.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=my-svelte-app-docs --branch=main --commit-hash=${{ github.sha }}
