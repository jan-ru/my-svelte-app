name: API docs (deploy)

# Stage: deployment (the `build` job also gives development feedback on pull requests). See docs/workflows.md.
# Builds the TypeDoc reference (`npm run docs`) and publishes it to GitHub Pages. Pull requests that touch the
# documented code only build it, so a doc warning shows up before merge; only main deploys. This is separate from the
# app's own deployment, which is Vercel (see vercel.json).
on:
  push:
    branches: [main]
    paths: [src/lib/**, typedoc.json, tsconfig.json, package.json, package-lock.json, .github/workflows/docs.yml]
  pull_request:
    paths: [src/lib/**, typedoc.json, tsconfig.json, package.json, package-lock.json, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs
      # Keep the reference out of search results; delete this step to let search engines index it.
      - run: find docs/api -name '*.html' -exec perl -pi -e 's|<head>|<head><meta name="robots" content="noindex">|' {} +
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
